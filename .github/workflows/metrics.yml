name: Metrics Dashboard
permissions: {}

on:
  schedule:
    - cron: "0 0 * * *"   # Runs daily at midnight UTC
  workflow_dispatch:       # Allows manual trigger
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MinhNghia2610
          template: classic
          config_timezone: Asia/Ho_Chi_Minh
          config_theme: tokyonight

          # Core metrics
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          output_action: commit

          # Commit language stats
          plugin_languages: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: programming, markup
          plugin_languages_colors: classic
          plugin_languages_limit: 6
          plugin_languages_recent_categories: programming, markup
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 500
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Follow-up / issue resolution
          plugin_followup: yes
          plugin_followup_sections: repositories

          # Stars & repositories
          plugin_stars: yes
          plugin_stars_limit: 4

          # Lines of code changed
          plugin_lines: yes

          # Recent activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: issue, pr, release, fork, review, ref/create
          plugin_activity_visibility: public

          # Achievements
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 6
