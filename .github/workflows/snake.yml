name: Generate Snake Animation
permissions: {}

on:
  schedule:
    - cron: "0 0 * * *"   # Runs daily at midnight
  workflow_dispatch:       # Allows manual trigger

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: MinhNghia2610
          outputs: |
            dist/snake.svg?color_snake=#00F7FF&color_dots=#0D1117,#1A2B3C,#2D4A5E,#4B7A9E,#6BA3D6
            dist/snake-dark.svg?color_snake=#FF6B6B&color_dots=#161B22,#1C2128,#30363D,#484F58,#6E7681

      - name: Commit and push snake assets
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "chore: update snake animation [skip ci]"
          add: "dist/snake*.svg"
