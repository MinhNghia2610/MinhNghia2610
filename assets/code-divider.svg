<svg width="100%" height="32" viewBox="0 0 600 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00F7FF" stop-opacity="1"/>
      <stop offset="75%" stop-color="#00F7FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00F7FF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00F7FF" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#00F7FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .comment-syntax {
      font-family: 'Courier New', 'Fira Code', monospace;
      font-size: 13px;
      fill: #6A9955;
    }
    .code-text {
      font-family: 'Courier New', 'Fira Code', monospace;
      font-size: 13px;
      fill: #00F7FF;
    }
    .divider-line {
      opacity: 0.15;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes typing {
      0% { width: 0; }
      40% { width: 0; }
      80% { width: 160px; }
      100% { width: 160px; }
    }
    @keyframes cursorMove {
      0% { transform: translateX(0); }
      40% { transform: translateX(0); }
      80% { transform: translateX(160px); }
      100% { transform: translateX(160px); }
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    .reveal {
      animation: typing 6s ease-in-out infinite;
      overflow: hidden;
      white-space: nowrap;
    }
    .pulse-line {
      animation: linePulse 4s ease-in-out infinite;
    }
    @keyframes linePulse {
      0%, 100% { opacity: 0.08; }
      50% { opacity: 0.25; }
    }
  </style>

  <!-- Background divider line -->
  <rect class="divider-line pulse-line" x="0" y="15" width="600" height="1" fill="url(#lineGrad)"/>
  <rect class="divider-line pulse-line" x="0" y="16" width="600" height="1" fill="url(#lineGrad)"/>

  <!-- Comment syntax "//" -->
  <text class="comment-syntax" x="20" y="22">//</text>

  <!-- Animated typing text -->
  <text class="code-text" font-size="13" x="44" y="22">
    <tspan>──────</tspan>
    <tspan fill="#FF6B6B">&lt;code/&gt;</tspan>
    <tspan>──────</tspan>
  </text>

  <!-- Blinking cursor -->
  <text class="cursor" x="272" y="22" fill="#00F7FF" font-family="monospace" font-size="14">▌</text>
</svg>
