<svg width="100%" height="4" viewBox="0 0 1200 4" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.0"/>
      <stop offset="15%" stop-color="#00F7FF" stop-opacity="0.4"/>
      <stop offset="35%" stop-color="#00F7FF" stop-opacity="1.0"/>
      <stop offset="50%" stop-color="#7B2FF7" stop-opacity="1.0"/>
      <stop offset="65%" stop-color="#00F7FF" stop-opacity="1.0"/>
      <stop offset="85%" stop-color="#00F7FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F7FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .base-line {
      fill: #00F7FF;
      opacity: 0.1;
    }
    .glow-layer {
      animation: glowPulse 3s ease-in-out infinite;
    }
    .neon-layer {
      animation: neonSlide 4s ease-in-out infinite;
    }
    .shimmer {
      animation: shimmerMove 2.5s linear infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes neonSlide {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(0%); }
      100% { transform: translateX(100%); }
    }
    @keyframes shimmerMove {
      0% { transform: translateX(-100%); opacity: 0; }
      30% { opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translateX(100%); opacity: 0; }
    }
  </style>

  <!-- Static base line -->
  <rect class="base-line" width="1200" height="2" y="1" rx="1"/>

  <!-- Animated glow layer -->
  <rect class="glow-layer" width="1200" height="4" fill="url(#neonGlow)" rx="2"/>

  <!-- Animated neon gradient layer -->
  <rect class="neon-layer" width="1200" height="2" y="1" fill="url(#neonGradient)" rx="1"/>

  <!-- Shimmer highlight -->
  <rect class="shimmer" width="300" height="2" y="1" fill="url(#neonGradient)" rx="1" opacity="0.8"/>
</svg>
